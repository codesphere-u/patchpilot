[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "1.1.0"
description = "Autonomous Code Repair Engine: Stack-Trace & AST Fault Localizer, Anti-Reward-Hacking Patch Verifier, Transactional Sandbox & MCP Server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" }
]
keywords = [
    "ai-agents",
    "coding-agent",
    "automated-program-repair",
    "fault-localization",
    "reward-hacking",
    "mcp",
    "ast",
    "static-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=9.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.4",
]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/patchpilot"
Repository = "https://github.com/codesphere-u/patchpilot"
Issues = "https://github.com/codesphere-u/patchpilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchpilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

[tool.coverage.run]
source = ["src/patchpilot"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.vercel]
entrypoint = "api.index:app"

