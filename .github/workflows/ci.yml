name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies with pip-audit
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip pip-audit
          .audit-venv/bin/pip install --no-cache-dir -e .
          .audit-venv/bin/pip-audit --skip-editable --progress-spinner off

  docker-build:
    name: Docker Image Build & Non-Root Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t patchpilot:ci .
      - name: Verify non-root container & package import
        run: docker run --rm --entrypoint python patchpilot:ci -c "import os, patchpilot, patchpilot.cli; assert os.geteuid() != 0"

  quality-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Typecheck with mypy
        run: mypy src/patchpilot api

      - name: Run tests with coverage
        run: pytest -v --cov=patchpilot --cov-report=term-missing --cov-fail-under=85

      - name: Run CLI demo and benchmark smoke gates
        run: |
          patchpilot demo
          patchpilot benchmark
